name: Nix

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/johnrichardrinehart/exe.dev-nixos

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            arch: amd64
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build image
        run: nix build ".#packages.${{ matrix.system }}.image" --print-build-logs

      - name: Inspect image archive
        run: nix run nixpkgs#skopeo -- inspect docker-archive:result

      - name: Publish architecture image
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH_TAG: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'unqualified-search-registries = []\n' > "${RUNNER_TEMP}/registries.conf"
          export CONTAINERS_REGISTRIES_CONF="${RUNNER_TEMP}/registries.conf"

          publish() {
            local tag="$1"
            nix run nixpkgs#skopeo -- copy \
              --dest-creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
              docker-archive:result \
              "docker://${REGISTRY_IMAGE}:${tag}-${ARCH_TAG}"
          }

          publish "sha-${GITHUB_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            publish "latest"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            publish "${GITHUB_REF_NAME//\//-}"
          fi

  manifest:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish manifest tags
        shell: bash
        run: |
          set -euo pipefail

          publish_manifest() {
            local tag="$1"
            docker buildx imagetools create \
              -t "${REGISTRY_IMAGE}:${tag}" \
              "${REGISTRY_IMAGE}:${tag}-amd64" \
              "${REGISTRY_IMAGE}:${tag}-arm64"
          }

          publish_manifest "sha-${GITHUB_SHA}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            publish_manifest "latest"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            publish_manifest "${GITHUB_REF_NAME//\//-}"
          fi
